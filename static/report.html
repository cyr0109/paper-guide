<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="app" class="status muted">載入中…</div>
<div id="tip" role="tooltip" hidden></div>
<script src="guide.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const rid = new URLSearchParams(location.search).get("id");
const app = document.getElementById("app");
let pdf, guide, page = 1, tab = "guide", rendering = false, rerender = false;
let qa = {};                          // 頁數 → [{q, a, at}]，存在伺服器的 qa.json
const pending = {}, errors = {}, drafts = {}, partial = {};  // 每頁各自的：等待中的問題、錯誤、還沒送出的草稿、邊寫邊顯示的答案

async function load() {
  const res = await fetch("/api/reports/" + encodeURIComponent(rid));
  const r = await res.json();
  if (!res.ok) return status(r.detail || "找不到這個報告");
  if (r.moved) return location.replace("report.html?id=" + encodeURIComponent(r.moved));
  if (r.status === "generating") {
    status('<span class="pulse"></span><h1>正在寫導讀</h1><p>Claude 在讀簡報和論文，通常要幾分鐘。<br>可以先關掉這頁，晚點再回來。</p><div class="actions"><a class="btn ghost" href="/">回首頁</a></div>');
    return setTimeout(load, 5000);
  }
  if (r.status === "error") {
    status('<h1>導讀沒有產生出來</h1><p>錯誤訊息在下面。按「重新產生」再跑一次。</p><div class="actions"><button class="btn primary" id="retry">重新產生</button><a class="btn ghost" href="/">回首頁</a></div><pre class="error"></pre>');
    app.querySelector(".error").textContent = r.error;
    document.getElementById("retry").onclick = async () => {
      await fetch("/api/reports/" + encodeURIComponent(rid) + "/retry", { method: "POST" });
      load();
    };
    return;
  }
  guide = r.guide;
  qa = r.qa || {};
  document.title = guide.title;
  pdf = await pdfjsLib.getDocument("/files/" + encodeURIComponent(rid) + "/slides.pdf").promise;
  buildViewer(r.papers || []);
}

function status(html) {
  app.className = "status";
  app.innerHTML = html;
}

function buildViewer(papers) {
  app.className = "viewer";
  app.innerHTML = `
    <header class="topbar">
      <a class="icon-btn" href="/" aria-label="回首頁">${icon("M15 6l-6 6 6 6")}</a>
      <h1 class="title"></h1>
      <div class="pager" role="group" aria-label="翻頁">
        <button class="icon-btn" id="prev" aria-label="上一頁">${icon("M15 6l-6 6 6 6")}</button>
        <input id="pageInput" inputmode="numeric" aria-label="目前頁數">
        <span class="total">/ ${pdf.numPages}</span>
        <button class="icon-btn" id="next" aria-label="下一頁">${icon("M9 6l6 6-6 6")}</button>
      </div>
      <div class="seg" role="tablist">
        <button role="tab" data-tab="guide">導讀</button>
        <button role="tab" data-tab="synthesis">綜整</button>
        <button role="tab" data-tab="glossary">術語表</button>
      </div>
      ${papers.map((f, i) => `<a class="btn ghost" href="/files/${encodeURIComponent(rid)}/${f}" target="_blank">${papers.length > 1 ? "論文 " + (i + 1) : "論文原文"}</a>`).join("")}
    </header>
    <div class="main">
      <div class="slide"><canvas aria-label="簡報頁面"></canvas></div>
      <div class="splitter" role="separator" aria-orientation="vertical" aria-label="拖曳調整簡報和導讀的寬度" tabindex="0" aria-valuemin="${SPLIT_MIN}" aria-valuemax="${SPLIT_MAX}"></div>
      <section class="panel" role="tabpanel"><div class="reading" id="panel"></div></section>
    </div>`;
  app.querySelector(".title").textContent = guide.title;
  const input = document.getElementById("pageInput");
  document.getElementById("prev").onclick = () => go(page - 1);
  document.getElementById("next").onclick = () => go(page + 1);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { go(parseInt(input.value, 10)); input.blur(); } });
  input.addEventListener("blur", () => { input.value = page; });
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderPanel(); });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, .splitter")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") go(page + 1);
    if (e.key === "ArrowLeft" || e.key === "PageUp") go(page - 1);
  });
  window.addEventListener("resize", renderSlide);
  setupTooltips(document.getElementById("panel"), guide.glossary || []);
  setupSplitter();
  go(parseInt(location.hash.slice(1), 10) || 1);
}

function go(n) {
  if (!(n >= 1 && n <= pdf.numPages)) n = page;
  page = n;
  history.replaceState(null, "", "#" + page);
  document.getElementById("pageInput").value = page;
  document.getElementById("prev").disabled = page === 1;
  document.getElementById("next").disabled = page === pdf.numPages;
  renderSlide();
  renderPanel();
}

// pdf.js 不允許同一個 canvas 同時畫兩次：正在畫就先記著，畫完再用最新的頁數/大小重畫一次
async function renderSlide() {
  if (rendering) { rerender = true; return; }
  rendering = true;
  try {
    do {
      rerender = false;
      const box = app.querySelector(".slide"), canvas = box.querySelector("canvas");
      const p = await pdf.getPage(page);
      const base = p.getViewport({ scale: 1 });
      const fit = Math.min((box.clientWidth - 32) / base.width, (box.clientHeight - 32) / base.height) || 1;
      const vp = p.getViewport({ scale: fit * devicePixelRatio });
      canvas.width = vp.width;
      canvas.height = vp.height;
      canvas.style.width = vp.width / devicePixelRatio + "px";
      await p.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    } while (rerender);
  } finally {
    rendering = false;
  }
}

function renderPanel() {
  const panel = document.getElementById("panel");
  document.getElementById("tip").hidden = true;  // 內容換掉時 mouseout 不會觸發
  app.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  if (tab === "guide") {
    const s = guide.slides.find(s => s.page === page);
    panel.innerHTML = `<h2>第 ${page} 頁</h2>` + (s ? richText(s.guide) : '<p class="muted">這頁沒有導讀。</p>') + qaHtml(page);
    setupQaForm(page);
  } else if (tab === "synthesis") {
    const y = guide.synthesis;
    panel.innerHTML = "<h2>綜整</h2>" + [["問題", y.problem], ["方法", y.method], ["結果", y.results], ["貢獻與限制", y.contributions]]
      .map(([h, t]) => `<h3>${h}</h3>` + richText(t)).join("");
  } else {
    const g = [...(guide.glossary || [])].sort((a, b) => a.term.localeCompare(b.term));
    panel.innerHTML = '<h2>術語表</h2><dl class="glossary">' +
      g.map(t => `<dt><span class="term">${esc(t.term)}</span><span class="zh">${esc(t.zh)}</span></dt><dd>${esc(t.gloss)}</dd>`).join("") + "</dl>";
  }
}

function qaHtml(p) {
  const items = (qa[p] || []).map(x =>
    `<div class="qa-item"><p class="qa-q">${esc(x.q)}</p><div class="qa-a">${richText(x.a)}</div></div>`).join("");
  const wait = pending[p] ? `<div class="qa-item"><p class="qa-q">${esc(pending[p])}</p>
    ${partial[p] ? `<div class="qa-a">${richText(partial[p])}</div>` : '<p class="qa-wait"><span class="pulse"></span>Claude 在想…</p>'}</div>` : "";
  const err = errors[p] ? `<p class="error" role="alert">${esc(errors[p])}</p>` : "";
  return `<section class="qa" aria-label="這頁的問答">
    ${items}${wait}${err}</section>
    <form class="qa-form">
      <textarea rows="2" aria-label="問 Claude 這頁的問題" placeholder="回覆 Claude…" ${pending[p] ? "disabled" : ""}></textarea>
      <div class="qa-actions"><span class="muted">⌘ Enter 送出</span>
        <button class="btn primary" type="submit" ${pending[p] ? "disabled" : ""}>問 Claude</button></div>
    </form>`;
}

function setupQaForm(p) {
  const form = app.querySelector(".qa-form"), box = form.querySelector("textarea");
  box.value = drafts[p] || "";
  box.addEventListener("input", () => { drafts[p] = box.value; });
  box.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) form.requestSubmit(); });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (box.value.trim()) askQuestion(p, box.value.trim());
  });
}

async function askQuestion(p, question) {
  pending[p] = question;
  delete errors[p];
  drafts[p] = "";
  refreshQa(p);
  try {
    const res = await fetch("/api/reports/" + encodeURIComponent(rid) + "/qa", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: p, question }),
    });
    if (!res.ok) {
      const data = await res.json();
      throw new Error(typeof data.detail === "string" ? data.detail : "問題格式不對");
    }
    // 伺服器一行傳一個 JSON：reset 清掉目前的字、delta 接上新的字、done 帶最後存好的答案
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", finished = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const l of lines) {
        const ev = JSON.parse(l);
        if (ev.t === "error") throw new Error(ev.msg);
        if (ev.t === "done") { (qa[p] = qa[p] || []).push(ev.entry); finished = true; }
        else { partial[p] = ev.t === "reset" ? "" : (partial[p] || "") + ev.text; refreshQa(p); }
      }
    }
    if (!finished) throw new Error("連線中斷了");
  } catch (err) {
    errors[p] = "沒有問成功：" + err.message;
    drafts[p] = question;  // 把問題放回輸入框，不用重打
  } finally {
    delete pending[p];
    delete partial[p];
    refreshQa(p);
  }
}

// 只有還停在同一頁的導讀時才重畫，翻走了就等翻回來再顯示
function refreshQa(p) {
  if (tab !== "guide" || page !== p) return;
  renderPanel();
  const scroller = app.querySelector(".panel");
  scroller.scrollTop = scroller.scrollHeight;
}

const SPLIT_MIN = 25, SPLIT_MAX = 80, SPLIT_DEFAULT = 62;

// 拖中間那條線調整左右比例，記在 localStorage（只是個人偏好，讀不到就用預設）
function setupSplitter() {
  const main = app.querySelector(".main"), bar = app.querySelector(".splitter");
  let frame;
  const set = (pct, save) => {
    pct = Math.round(Math.min(SPLIT_MAX, Math.max(SPLIT_MIN, pct)));
    main.style.setProperty("--split", pct + "%");
    bar.setAttribute("aria-valuenow", pct);
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(renderSlide);
    if (save) try { localStorage.setItem("split", pct); } catch {}
  };
  let saved;
  try { saved = parseFloat(localStorage.getItem("split")); } catch {}
  set(saved || SPLIT_DEFAULT, false);
  const fromPointer = e => { const r = main.getBoundingClientRect(); return (e.clientX - r.left) / r.width * 100; };
  bar.addEventListener("pointerdown", e => {
    bar.setPointerCapture(e.pointerId);
    main.classList.add("dragging");
  });
  bar.addEventListener("pointermove", e => { if (bar.hasPointerCapture(e.pointerId)) set(fromPointer(e), false); });
  bar.addEventListener("pointerup", e => {
    main.classList.remove("dragging");
    set(fromPointer(e), true);
    bar.blur();  // 滑鼠拖完把焦點放掉，左右鍵才會繼續翻頁
  });
  bar.addEventListener("dblclick", () => set(SPLIT_DEFAULT, true));
  bar.addEventListener("keydown", e => {
    const now = +bar.getAttribute("aria-valuenow");
    if (e.key === "ArrowLeft") set(now - 5, true);
    else if (e.key === "ArrowRight") set(now + 5, true);
    else return;
    e.preventDefault();
  });
}

function icon(d) {
  return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
}

load();
</script>
</body>
</html>
